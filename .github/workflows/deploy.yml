name: exploretech.la Continuous Deployment

# Publishes the production build to the gh-pages branch. Only pushes to master
# deploy; pull requests are verified by the continuous integration workflow.
on:
  push:
    branches: [master]

# The workflow token is never used to publish (the deploy step uses
# DEPLOY_ACCESS_TOKEN), so read access to the checkout is enough.
permissions:
  contents: read

# Never run two publishes against gh-pages at once, and never cancel a publish
# that is already in flight.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checks out the repository under $GITHUB_WORKSPACE
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy step configures its own credentialed remote.
          persist-credentials: false

      # Installs the Node version pinned in .nvmrc, with an npm cache
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the production site
        env:
          VITE_GOOGLE_ANALYTICS_TRACKING_ID: ${{ secrets.GOOGLE_ANALYTICS_TRACKING_ID }}
        run: npm run build

      # Publish the verified output without running build tools with the token.
      - name: Publish to gh-pages
        env:
          USER_NAME: "exploretech.la"
          USER_EMAIL: "exploretechla@cs.ucla.edu"
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
        run: |
          git config --global user.name "$USER_NAME"
          git config --global user.email "$USER_EMAIL"
          git remote set-url origin "https://${GITHUB_TOKEN}@github.com/${REPOSITORY}"
          ./node_modules/.bin/gh-pages -d build
